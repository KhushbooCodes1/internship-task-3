<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frontend Internship Project</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="hero">
      <div class="hero-text">
        <h1>Frontend Interactive Project</h1>

        <p>Learn JavaScript Basics, DOM Manipulation & Interactive UI</p>

        <button id="heroBtn">Explore</button>
      </div>
    </header>

    <section class="tech">
      <h2>Technologies Used</h2>

      <div class="icons">
        <img src="images/html.jpg" />
        <img src="images/css.jpg" />
        <img src="images/js.jpg" />
      </div>
    </section>

    <section class="interaction">
      <h2>Try Interaction</h2>

      <p id="message">Click the button to see DOM manipulation.</p>

      <button id="changeBtn">Click Me</button>
    </section>

    <section class="form-section">
      <h2>Contact Form</h2>

      <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name" />

        <input type="email" id="email" placeholder="Your Email" />

        <button type="submit">Submit</button>

        <p id="formMessage"></p>
      </form>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
